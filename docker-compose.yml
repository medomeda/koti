# Déploiement Coolify : application KOTI + base PostgreSQL (version de démonstration : données fictives).
# Guide : docs/DEPLOIEMENT_COOLIFY.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: koti
      # Généré et conservé par Coolify.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: koti
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koti -d koti"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://koti:${SERVICE_PASSWORD_POSTGRES}@db:5432/koti
      # Les migrations s'appliquent au démarrage ; sur une instance de démonstration vide, les données fictives sont importées.
      KOTI_AUTO_MIGRATE: "1"
      # Généré et conservé par Coolify (secret des routes d'administration /api/v1/*).
      CRON_SECRET: ${SERVICE_HEX_64_CRONSECRET}
      KOTI_DEMO_MODE: ${KOTI_DEMO_MODE:-1}
      KOTI_ALLOW_DEMO_RESET: ${KOTI_ALLOW_DEMO_RESET:-0}
      # Derrière le proxy Traefik de Coolify : IP client lue dans X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3700/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  pg-data:
