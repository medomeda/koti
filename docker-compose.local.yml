# Test local de l'image : docker compose -f docker-compose.with-db.yml -f docker-compose.local.yml up -d --build
services:
  db:
    environment:
      POSTGRES_PASSWORD: local-password
  app:
    ports:
      - "3701:3700"
    environment:
      DATABASE_URL: postgresql://koti:local-password@db:5432/koti
      CRON_SECRET: local-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_SECRET: local-auth-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3701
      # Test local : démonstration avec données fictives (retirer ces lignes pour tester la production).
      KOTI_DEMO_MODE: "0"
