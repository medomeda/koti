# Déploiement Coolify SANS base de données intégrée : seule l'application KOTI est déployée et elle se connecte à une
# base PostgreSQL 14+ déjà existante (serveur dédié, base gérée par Coolify ou par un hébergeur). Variante avec base : docker-compose.with-db.yml (phase de test : démonstration active par défaut ; production : KOTI_DEMO_MODE=0).
# Guide : docs/DEPLOIEMENT_COOLIFY.md
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Adresse de la base PostgreSQL existante (obligatoire), ex. postgresql://utilisateur:motdepasse@hote:5432/koti
      # Les caractères spéciaux du mot de passe s'encodent (@ → %40, ! → %21). Ajoutez ?sslmode=require si l'hébergeur l'exige.
      DATABASE_URL: ${DATABASE_URL}
      # Les migrations s'appliquent au démarrage.
      KOTI_AUTO_MIGRATE: "1"
      # Premier compte Super administrateur (créé seulement s'il n'existe aucun compte d'équipe ; mot de passe de 12 caractères minimum).
      KOTI_BOOTSTRAP_ADMIN_EMAIL: ${KOTI_BOOTSTRAP_ADMIN_EMAIL:-}
      KOTI_BOOTSTRAP_ADMIN_PASSWORD: ${KOTI_BOOTSTRAP_ADMIN_PASSWORD:-}
      KOTI_BOOTSTRAP_ADMIN_NAME: ${KOTI_BOOTSTRAP_ADMIN_NAME:-}
      # Règlement des offres payantes : 0 = manuel (l'équipe KOTI active l'offre après paiement), 1 = paiement en ligne (à brancher).
      KOTI_ONLINE_PAYMENTS: ${KOTI_ONLINE_PAYMENTS:-0}
      # Généré et conservé par Coolify (secret des routes d'administration /api/v1/*).
      CRON_SECRET: ${SERVICE_HEX_64_CRONSECRET}
      # Authentification (Better Auth) : secret généré par Coolify ; adresse publique à renseigner (ex. https://koti-demo.mondomaine.com).
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_BETTERAUTHSECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # E-mails (facultatif) : sans SMTP_URL, les messages sont seulement écrits dans les journaux du serveur.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-KOTI <no-reply@koti.app>}
      KOTI_REQUIRE_EMAIL_VERIFICATION: ${KOTI_REQUIRE_EMAIL_VERIFICATION:-0}
      # Notifications push (facultatif) : paire de clés générée UNE fois par `npm run push:keys`, à garder (changer la clé coupe les abonnements).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@koti.app}
      # Phase de test : démonstration active par défaut (bandeau, comptes fictifs, page /guide, données importées dans une base vide).
      # Passer à 0 pour la production réelle.
      KOTI_DEMO_MODE: ${KOTI_DEMO_MODE:-1}
      KOTI_ALLOW_DEMO_RESET: ${KOTI_ALLOW_DEMO_RESET:-0}
      # Derrière le proxy Traefik de Coolify : IP client lue dans X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3700/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
